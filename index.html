<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Поздравлялка 2.0</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #222;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      background: #447bba;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #status {
      margin: 16px 0;
      padding: 12px;
      border-radius: 10px;
      background: #f0f2f5;
    }

    .friend {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .date {
      font-weight: bold;
    }

    a {
      color: #447bba;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🎂 Поздравлялка 2.0</h1>

  <p>
    Приложение получает список моих друзей VK
    и доступные даты их рождения.
  </p>

  <button id="start" disabled>
    Получить дни рождения друзей
  </button>

  <div id="status">
    Инициализируем приложение VK...
  </div>

  <div id="friends"></div>

</div>


<script>

  const APP_ID = 54728607;
  const API_VERSION = "5.199";

  const startButton = document.getElementById("start");
  const status = document.getElementById("status");
  const friendsBox = document.getElementById("friends");


  // --------------------------------------------------
  // ИНИЦИАЛИЗАЦИЯ VK
  // --------------------------------------------------

  async function initApp() {

    try {

      status.textContent = "Подключаемся к VK...";

      const result = await vkBridge.send("VKWebAppInit");

      console.log("VK Bridge инициализирован:", result);

      status.textContent =
        "Приложение подключено к VK. Можно получить дни рождения.";

      startButton.disabled = false;

    } catch (error) {

      console.error("Ошибка VKWebAppInit:", error);

      showError(
        "Не удалось подключить приложение к VK.",
        error
      );
    }
  }


  // --------------------------------------------------
  // ПОЛУЧЕНИЕ ДРУЗЕЙ
  // --------------------------------------------------

  async function start() {

    startButton.disabled = true;
    friendsBox.innerHTML = "";

    try {

      status.textContent =
        "Запрашиваем разрешение на список друзей...";


      // Получаем пользовательский токен
      const auth = await vkBridge.send(
        "VKWebAppGetAuthToken",
        {
          app_id: APP_ID,
          scope: "friends"
        }
      );


      console.log("Ответ авторизации VK:", auth);


      if (!auth || !auth.access_token) {

        throw new Error(
          "VK не выдал токен доступа."
        );
      }


      status.textContent =
        "Получаем список друзей...";


      // Получаем друзей через VK API
      const result = await vkBridge.send(
        "VKWebAppCallAPIMethod",
        {
          method: "friends.get",

          params: {
            access_token: auth.access_token,
            v: API_VERSION,

            fields: "bdate,domain",
            count: 5000
          }
        }
      );


      console.log("Ответ friends.get:", result);


      if (!result || !result.response) {

        throw result || {
          message: "VK не вернул список друзей."
        };
      }


      const friends =
        result.response.items || [];


      // --------------------------------------------------
      // ОСТАВЛЯЕМ ТОЛЬКО ДРУЗЕЙ С ДАТОЙ РОЖДЕНИЯ
      // --------------------------------------------------

      const withBirthday =
        friends.filter(friend => friend.bdate);


      // --------------------------------------------------
      // СОРТИРОВКА ПО ДНЮ И МЕСЯЦУ
      // --------------------------------------------------

      withBirthday.sort((a, b) => {

        const aParts =
          a.bdate.split(".");

        const bParts =
          b.bdate.split(".");


        const aDay =
          Number(aParts[0]);

        const aMonth =
          Number(aParts[1]);


        const bDay =
          Number(bParts[0]);

        const bMonth =
          Number(bParts[1]);


        return (
          (aMonth * 100 + aDay) -
          (bMonth * 100 + bDay)
        );

      });


      // --------------------------------------------------
      // СТАТИСТИКА
      // --------------------------------------------------

      status.innerHTML =
        "Всего друзей: <b>" +
        friends.length +
        "</b><br>" +

        "Даты рождения доступны: <b>" +
        withBirthday.length +
        "</b>";


      // --------------------------------------------------
      // ЕСЛИ ДАТ РОЖДЕНИЯ НЕТ
      // --------------------------------------------------

      if (withBirthday.length === 0) {

        friendsBox.innerHTML =
          "<p>" +
          "VK не вернул ни одной доступной даты рождения." +
          "</p>";

        return;
      }


      // --------------------------------------------------
      // ВЫВОД ДРУЗЕЙ
      // --------------------------------------------------

      withBirthday.forEach(friend => {

        const div =
          document.createElement("div");

        div.className = "friend";


        const profileUrl =
          friend.domain
            ? "https://vk.ru/" + friend.domain
            : "https://vk.ru/id" + friend.id;


        div.innerHTML =

          "<a href=\"" +
          profileUrl +
          "\" target=\"_blank\">" +

          escapeHtml(
            friend.first_name +
            " " +
            friend.last_name
          ) +

          "</a>" +

          " — " +

          "<span class=\"date\">" +

          escapeHtml(friend.bdate) +

          "</span>";


        friendsBox.appendChild(div);

      });


    } catch (error) {

      console.error(
        "Ошибка при получении друзей:",
        error
      );


      showError(
        "Не получилось получить друзей VK.",
        error
      );

    } finally {

      startButton.disabled = false;

    }

  }


  // --------------------------------------------------
  // НОРМАЛЬНЫЙ ВЫВОД ОШИБКИ
  // --------------------------------------------------

  function showError(title, error) {

    let errorText = "";


    if (error) {

      if (
        error.error_data &&
        error.error_data.error_msg
      ) {

        errorText =
          error.error_data.error_msg;

      } else if (
        error.error_data &&
        error.error_data.error_code
      ) {

        errorText =
          "Код ошибки VK: " +
          error.error_data.error_code;

      } else if (error.message) {

        errorText =
          error.message;

      } else {

        try {

          errorText =
            JSON.stringify(error);

        } catch (e) {

          errorText =
            String(error);

        }

      }

    }


    if (!errorText) {

      errorText =
        "Причина ошибки не определена.";

    }


    status.innerHTML =
      "<b>" +
      escapeHtml(title) +
      "</b><br>" +

      escapeHtml(errorText);


    // Дополнительно выводим подробную информацию
    // в консоль браузера
    console.error(
      "Подробная ошибка:",
      error
    );

  }


  // --------------------------------------------------
  // ЗАЩИТА HTML
  // --------------------------------------------------

  function escapeHtml(text) {

    return String(text)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");
  }


  // --------------------------------------------------
  // КНОПКА
  // --------------------------------------------------

  startButton.addEventListener(
    "click",
    start
  );


  // --------------------------------------------------
  // ЗАПУСК ПРИЛОЖЕНИЯ
  // --------------------------------------------------

  initApp();

</script>

</body>
</html>
