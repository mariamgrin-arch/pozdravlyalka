<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Поздравлялка 2.0</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #222;
    }

    .box {
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0;
      color: #626d7a;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .main-button {
      margin-top: 18px;
      background: #447bba;
      color: white;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #f0f2f5;
      color: #444;
      line-height: 1.5;
    }

    .section {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 21px;
    }

    .today-title {
      color: #e05252;
    }

    .soon-title {
      color: #447bba;
    }

    .done-title {
      color: #35a56a;
    }

    .friend {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .friend:last-child {
      border-bottom: 0;
    }

    .friend-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    .friend-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .friend-name a {
      color: #222;
      text-decoration: none;
    }

    .birthday {
      color: #626d7a;
      font-size: 14px;
      line-height: 1.4;
    }

    .when {
      color: #447bba;
      font-weight: 600;
    }

    .today .when {
      color: #e05252;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-left: 66px;
    }

    .dialog-button {
      background: #447bba;
      color: white;
    }

    .generate-button {
      background: #f0e8ff;
      color: #7650a8;
    }

    .done-button {
      background: #e7f6ed;
      color: #258151;
    }

    .undo-button {
      background: #f0f2f5;
      color: #626d7a;
    }

    .generator {
      display: none;
      margin-top: 14px;
      margin-left: 66px;
      padding: 16px;
      background: #f7f5fb;
      border-radius: 14px;
    }

    .generator.visible {
      display: block;
    }

    .generator-title {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .style-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .style-button {
      background: white;
      color: #626d7a;
      border: 1px solid #ddd;
      padding: 8px 10px;
      font-size: 12px;
    }

    .style-button.active {
      background: #447bba;
      color: white;
      border-color: #447bba;
    }

    .message {
      background: white;
      border-radius: 12px;
      padding: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }

    .generator-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .copy-button {
      background: #eaf2fb;
      color: #447bba;
    }

    .new-button {
      background: #f0f2f5;
      color: #626d7a;
    }

    .empty {
      color: #818c99;
      padding: 8px 0;
      line-height: 1.5;
    }

    .all-button {
      width: 100%;
      background: #f0f2f5;
      color: #447bba;
      margin-top: 4px;
    }

    .all-list {
      display: none;
    }

    .all-list.visible {
      display: block;
    }

    .done-card {
      opacity: 0.75;
    }

    .done-label {
      color: #35a56a;
      font-weight: 600;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .header,
      .section {
        border-radius: 16px;
        padding: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .actions,
      .generator {
        margin-left: 0;
        padding-left: 0;
      }

      .friend-main {
        align-items: flex-start;
      }

      .avatar {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>


<body>

<div class="box">

  <!-- ШАПКА -->

  <div class="header">

    <h1>🎂 Поздравлялка 2.0</h1>

    <p class="subtitle">
      Я слежу за днями рождения твоих друзей,
      чтобы ты ничего не забыла.
    </p>

    <button
      id="start"
      class="main-button"
      disabled
    >
      Загрузить дни рождения
    </button>

    <div id="status">
      Подключаемся к VK...
    </div>

  </div>


  <!-- СЕГОДНЯ -->

  <div
    id="todaySection"
    class="section"
    style="display: none;"
  >

    <h2 class="section-title today-title">
      🎉 Сегодня нужно поздравить
    </h2>

    <div id="todayList"></div>

  </div>


  <!-- СКОРО -->

  <div
    id="soonSection"
    class="section"
    style="display: none;"
  >

    <h2 class="section-title soon-title">
      📅 Скоро
    </h2>

    <div id="soonList"></div>

  </div>


  <!-- УЖЕ ПОЗДРАВИЛИ -->

  <div
    id="doneSection"
    class="section"
    style="display: none;"
  >

    <h2 class="section-title done-title">
      ✅ Уже поздравили
    </h2>

    <div id="doneList"></div>

  </div>


  <!-- ЕСЛИ НИКОГО НЕТ -->

  <div
    id="nothingSection"
    class="section"
    style="display: none;"
  >

    <div class="empty">
      ☕ Сегодня никого поздравлять не нужно.
      <br><br>
      Можно спокойно заниматься своими делами.
    </div>

  </div>


  <!-- ВЕСЬ СПИСОК -->

  <div
    id="allSection"
    class="section"
    style="display: none;"
  >

    <h2 class="section-title">
      👥 Все друзья с датой рождения
    </h2>

    <div
      id="allList"
      class="all-list"
    ></div>

    <button
      id="allButton"
      class="all-button"
    >
      Показать всех друзей
    </button>

  </div>

</div>


<script>

  const APP_ID = 54728607;
  const API_VERSION = "5.199";

  const startButton =
    document.getElementById("start");

  const status =
    document.getElementById("status");

  const todaySection =
    document.getElementById("todaySection");

  const soonSection =
    document.getElementById("soonSection");

  const doneSection =
    document.getElementById("doneSection");

  const nothingSection =
    document.getElementById("nothingSection");

  const allSection =
    document.getElementById("allSection");

  const todayList =
    document.getElementById("todayList");

  const soonList =
    document.getElementById("soonList");

  const doneList =
    document.getElementById("doneList");

  const allList =
    document.getElementById("allList");

  const allButton =
    document.getElementById("allButton");


  let allFriends = [];


  // ==================================================
  // СОХРАНЕНИЕ ПОЗДРАВЛЕННЫХ
  // ==================================================

  function getStorageKey() {

    return (
      "pozdravlyalka_done_" +
      new Date().getFullYear()
    );

  }


  function getDoneFriends() {

    try {

      return JSON.parse(
        localStorage.getItem(
          getStorageKey()
        )
      ) || {};

    } catch (error) {

      return {};

    }

  }


  function saveDoneFriends(data) {

    localStorage.setItem(
      getStorageKey(),
      JSON.stringify(data)
    );

  }


  function isCongratulated(id) {

    const done =
      getDoneFriends();

    return Boolean(done[id]);

  }


  function markCongratulated(id) {

    const done =
      getDoneFriends();

    done[id] = true;

    saveDoneFriends(done);

  }


  function unmarkCongratulated(id) {

    const done =
      getDoneFriends();

    delete done[id];

    saveDoneFriends(done);

  }


  // ==================================================
  // ИНИЦИАЛИЗАЦИЯ VK
  // ==================================================

  async function initApp() {

    try {

      status.textContent =
        "Подключаемся к VK...";

      const result =
        await vkBridge.send(
          "VKWebAppInit"
        );

      console.log(
        "VK Bridge:",
        result
      );

      status.textContent =
        "Приложение подключено. Можно загрузить дни рождения.";

      startButton.disabled = false;

    } catch (error) {

      console.error(
        error
      );

      showError(
        "Не удалось подключить приложение к VK.",
        error
      );

    }

  }


  // ==================================================
  // ЗАГРУЗКА ДРУЗЕЙ
  // ==================================================

  async function start() {

    startButton.disabled = true;

    status.textContent =
      "Запрашиваем доступ к списку друзей...";


    try {

      const auth =
        await vkBridge.send(
          "VKWebAppGetAuthToken",
          {
            app_id: APP_ID,
            scope: "friends"
          }
        );


      if (
        !auth ||
        !auth.access_token
      ) {

        throw new Error(
          "VK не выдал токен доступа."
        );

      }


      status.textContent =
        "Получаем список друзей...";


      const result =
        await vkBridge.send(
          "VKWebAppCallAPIMethod",
          {
            method: "friends.get",

            params: {

              access_token:
                auth.access_token,

              v: API_VERSION,

              fields:
                "bdate,domain,photo_200",

              count: 5000

            }

          }
        );


      if (
        !result ||
        !result.response
      ) {

        throw result || {
          message:
            "VK не вернул список друзей."
        };

      }


      allFriends =
        result.response.items || [];


      const withBirthday =
        allFriends.filter(
          friend =>
            friend.bdate
        );


      status.innerHTML =
        "👥 Друзей: <b>" +
        allFriends.length +
        "</b><br>" +

        "🎂 С датой рождения: <b>" +
        withBirthday.length +
        "</b>";


      renderBirthdays(
        withBirthday
      );


    } catch (error) {

      console.error(
        "Ошибка:",
        error
      );

      showError(
        "Не получилось получить друзей VK.",
        error
      );

    } finally {

      startButton.disabled = false;

    }

  }


  // ==================================================
  // ИНФОРМАЦИЯ О ДНЕ РОЖДЕНИЯ
  // ==================================================

  function getBirthdayInfo(bdate) {

    const parts =
      bdate.split(".").map(Number);

    const day =
      parts[0];

    const month =
      parts[1];

    const birthYear =
      parts.length >= 3
        ? parts[2]
        : null;


    const now =
      new Date();

    const currentYear =
      now.getFullYear();


    const today =
      new Date(
        currentYear,
        now.getMonth(),
        now.getDate()
      );


    let birthdayDate =
      new Date(
        currentYear,
        month - 1,
        day
      );


    if (
      birthdayDate < today
    ) {

      birthdayDate =
        new Date(
          currentYear + 1,
          month - 1,
          day
        );

    }


    const difference =
      birthdayDate - today;


    const daysUntil =
      Math.round(
        difference /
        (1000 * 60 * 60 * 24)
      );


    let age = null;


    if (birthYear) {

      age =
        birthdayDate.getFullYear() -
        birthYear;

    }


    return {

      day,
      month,
      birthYear,
      birthdayDate,
      daysUntil,
      age

    };

  }


  // ==================================================
  // ТЕКСТ СРОКА
  // ==================================================

  function getWhenText(
    daysUntil
  ) {

    if (
      daysUntil === 0
    ) {

      return "Сегодня 🎉";

    }


    if (
      daysUntil === 1
    ) {

      return "Завтра";

    }


    if (
      daysUntil === 2
    ) {

      return "Послезавтра";

    }


    return (
      "Через " +
      daysUntil +
      " " +
      pluralizeDays(
        daysUntil
      )
    );

  }


  function pluralizeDays(
    number
  ) {

    const lastTwo =
      number % 100;

    const last =
      number % 10;


    if (
      lastTwo >= 11 &&
      lastTwo <= 19
    ) {

      return "дней";

    }


    if (
      last === 1
    ) {

      return "день";

    }


    if (
      last >= 2 &&
      last <= 4
    ) {

      return "дня";

    }


    return "дней";

  }


  // ==================================================
  // ДАТА
  // ==================================================

  function formatDate(
    info
  ) {

    const months = [

      "января",
      "февраля",
      "марта",
      "апреля",
      "мая",
      "июня",
      "июля",
      "августа",
      "сентября",
      "октября",
      "ноября",
      "декабря"

    ];


    return (
      info.day +
      " " +
      months[
        info.month - 1
      ]
    );

  }


  // ==================================================
  // ВОЗРАСТ
  // ==================================================

  function pluralizeYears(
    number
  ) {

    const lastTwo =
      number % 100;

    const last =
      number % 10;


    if (
      lastTwo >= 11 &&
      lastTwo <= 19
    ) {

      return "лет";

    }


    if (
      last === 1
    ) {

      return "год";

    }


    if (
      last >= 2 &&
      last <= 4
    ) {

      return "года";

    }


    return "лет";

  }


  // ==================================================
  // ГЕНЕРАТОР ПОЗДРАВЛЕНИЙ
  // ==================================================

  const greetingTemplates = {

    warm: [

      "{name}, с днём рождения! 🎉 Желаю тебе много счастливых моментов, тепла, радости и людей, рядом с которыми действительно хорошо. Пусть всё задуманное получается! ❤️",

      "С днём рождения, {name}! 🥳 Пусть этот год принесёт тебе много приятных событий, новых возможностей и поводов улыбаться. Желаю счастья, здоровья и исполнения желаний! ❤️",

      "{name}, поздравляю с днём рождения! 🎂 Желаю тебе побольше радостных дней, классных впечатлений и исполнения всего, чего хочется. Пусть впереди будет много хорошего! ✨"

    ],


    friendly: [

      "{name}, с днём рождения! 🎉 Желаю тебе море классных событий, хорошего настроения и чтобы жизнь почаще радовала приятными сюрпризами! Обнимаю ❤️",

      "С днём рождения, {name}! 🥳 Пусть всё складывается именно так, как тебе хочется, а рядом всегда будут свои люди. Классного тебе года! 🎂",

      "{name}, поздравляю! 🎂 Желаю побольше поводов радоваться, поменьше поводов нервничать и чтобы этот год оказался реально крутым! ❤️"

    ],


    funny: [

      "{name}, с днём рождения! 🎉 Желаю, чтобы денег было много, проблем мало, а настроение стабильно было на уровне «ну всё, жизнь удалась» 😂❤️",

      "С днём рождения, {name}! 🥳 Желаю официально стать ещё прекраснее, мудрее и богаче — желательно одновременно 😂 Пусть год будет огонь! 🔥",

      "{name}, поздравляю! 🎂 Пусть возраст остаётся просто цифрой, а энергии хватает на все безумные идеи и хорошие приключения 😂❤️"

    ],


    short: [

      "{name}, с днём рождения! 🎉 Счастья, здоровья, любви, классных людей рядом и исполнения желаний! ❤️",

      "С днём рождения, {name}! 🥳 Пусть всё задуманное получается, а каждый день приносит что-нибудь хорошее! ❤️",

      "{name}, поздравляю! 🎂 Желаю счастья, радости, вдохновения и побольше прекрасных моментов! ✨"

    ]

  };


  function generateGreeting(
    friend,
    info,
    style
  ) {

    const templates =
      greetingTemplates[
        style
      ];


    const template =
      templates[
        Math.floor(
          Math.random() *
          templates.length
        )
      ];


    return template.replace(
      "{name}",
      friend.first_name
    );

  }


  // ==================================================
  // КАРТОЧКА ДРУГА
  // ==================================================

  function createFriendCard(
    friend,
    info
  ) {

    const done =
      isCongratulated(
        friend.id
      );


    const div =
      document.createElement("div");


    div.className =
      "friend" +
      (
        done
          ? " done-card"
          : ""
      );


    const profileUrl =
      friend.domain
        ? "https://vk.ru/" +
          friend.domain
        : "https://vk.ru/id" +
          friend.id;


    const avatar =
      friend.photo_200 ||
      "";


    const ageText =
      info.age !== null
        ? "🎂 " +
          info.age +
          " " +
          pluralizeYears(
            info.age
          )
        : "🎂 Возраст неизвестен";


    div.innerHTML = `

      <div class="friend-main">

        ${
          avatar
            ? `
              <img
                class="avatar"
                src="${escapeHtml(avatar)}"
                alt=""
              >
            `
            : `
              <div class="avatar"></div>
            `
        }

        <div class="friend-info">

          <div class="friend-name">

            <a
              href="${escapeHtml(profileUrl)}"
              target="_blank"
            >
              ${escapeHtml(
                friend.first_name +
                " " +
                friend.last_name
              )}
            </a>

          </div>


          <div class="birthday">

            ${formatDate(info)}

            ·

            <strong>
              ${ageText}
            </strong>

            <br>

            ${
              done
                ? `
                  <span class="done-label">
                    ✅ Уже поздравили
                  </span>
                `
                : `
                  <span class="when">
                    ${getWhenText(
                      info.daysUntil
                    )}
                  </span>
                `
            }

          </div>

        </div>

      </div>


      <div class="actions">

        ${
          done
            ? `
              <button
                class="undo-button"
                onclick="undoCongratulation(${friend.id})"
              >
                ↩ Отменить отметку
              </button>
            `
            : `
              <button
                class="generate-button"
                onclick="toggleGenerator(${friend.id})"
              >
                ✨ Создать поздравление
              </button>
            `
        }


        <button
          class="dialog-button"
          onclick="openDialog(${friend.id})"
        >
          💬 Открыть диалог
        </button>


        ${
          !done
            ? `
              <button
                class="done-button"
                onclick="congratulated(${friend.id})"
              >
                ✅ Я поздравила
              </button>
            `
            : ""
        }

      </div>


      ${
        !done
          ? `
            <div
              id="generator-${friend.id}"
              class="generator"
            >

              <div class="generator-title">
                ✨ Какое поздравление сделать?
              </div>


              <div class="style-buttons">

                <button
                  class="style-button active"
                  onclick="selectStyle(${friend.id}, 'warm', this)"
                >
                  ❤️ Душевное
                </button>

                <button
                  class="style-button"
                  onclick="selectStyle(${friend.id}, 'friendly', this)"
                >
                  🥳 Дружеское
                </button>

                <button
                  class="style-button"
                  onclick="selectStyle(${friend.id}, 'funny', this)"
                >
                  😂 С юмором
                </button>

                <button
                  class="style-button"
                  onclick="selectStyle(${friend.id}, 'short', this)"
                >
                  ✨ Короткое
                </button>

              </div>


              <div
                id="message-${friend.id}"
                class="message"
              >
                ${escapeHtml(
                  generateGreeting(
                    friend,
                    info,
                    "warm"
                  )
                )}
              </div>


              <div class="generator-actions">

                <button
                  class="copy-button"
                  onclick="copyGreeting(${friend.id})"
                >
                  📋 Скопировать
                </button>


                <button
                  class="new-button"
                  onclick="newGreeting(${friend.id})"
                >
                  🔄 Другой вариант
                </button>

              </div>

            </div>
          `
          : ""
      }

    `;


    return div;

  }


  // ==================================================
  // ОТКРЫТЬ ГЕНЕРАТОР
  // ==================================================

  function toggleGenerator(
    id
  ) {

    const generator =
      document.getElementById(
        "generator-" + id
      );


    if (
      !generator
    ) {

      return;

    }


    generator.classList.toggle(
      "visible"
    );

  }


  // ==================================================
  // ВЫБОР СТИЛЯ
  // ==================================================

  function selectStyle(
    id,
    style,
    button
  ) {

    const friend =
      allFriends.find(
        item =>
          item.id === id
      );


    if (!friend) {
      return;
    }


    const info =
      getBirthdayInfo(
        friend.bdate
      );


    const message =
      document.getElementById(
        "message-" + id
      );


    if (!message) {
      return;
    }


    message.textContent =
      generateGreeting(
        friend,
        info,
        style
      );


    const buttons =
      button
        .parentElement
        .querySelectorAll(
          ".style-button"
        );


    buttons.forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


    button.classList.add(
      "active"
    );

  }


  // ==================================================
  // НОВЫЙ ВАРИАНТ
  // ==================================================

  function newGreeting(
    id
  ) {

    const friend =
      allFriends.find(
        item =>
          item.id === id
      );


    if (!friend) {
      return;
    }


    const info =
      getBirthdayInfo(
        friend.bdate
      );


    const message =
      document.getElementById(
        "message-" + id
      );


    if (!message) {
      return;
    }


    const activeButton =
      document.querySelector(
        "#generator-" +
        id +
        " .style-button.active"
      );


    let style =
      "warm";


    if (
      activeButton
    ) {

      const buttons =
        Array.from(
          document.querySelectorAll(
            "#generator-" +
            id +
            " .style-button"
          )
        );


      const index =
        buttons.indexOf(
          activeButton
        );


      const styles = [
        "warm",
        "friendly",
        "funny",
        "short"
      ];


      style =
        styles[index] ||
        "warm";

    }


    message.textContent =
      generateGreeting(
        friend,
        info,
        style
      );

  }


  // ==================================================
  // КОПИРОВАНИЕ
  // ==================================================

  async function copyGreeting(
    id
  ) {

    const message =
      document.getElementById(
        "message-" + id
      );


    if (!message) {
      return;
    }


    const text =
      message.textContent;


    try {

      await navigator.clipboard.writeText(
        text
      );


      alert(
        "Поздравление скопировано ❤️"
      );


    } catch (error) {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        text;


      document.body.appendChild(
        textarea
      );


      textarea.select();


      document.execCommand(
        "copy"
      );


      textarea.remove();


      alert(
        "Поздравление скопировано ❤️"
      );

    }

  }


  // ==================================================
  // ОТКРЫТЬ ДИАЛОГ
  // ==================================================

  function openDialog(
    id
  ) {

    const url =
      "https://vk.ru/im?sel=" +
      id;


    window.open(
      url,
      "_blank"
    );

  }


  // ==================================================
  // ПОЗДРАВИЛА
  // ==================================================

  function congratulated(
    id
  ) {

    markCongratulated(
      id
    );


    const friend =
      allFriends.find(
        item =>
          item.id === id
      );


    if (!friend) {
      return;
    }


    const withBirthday =
      allFriends.filter(
        item =>
          item.bdate
      );


    renderBirthdays(
      withBirthday
    );

  }


  // ==================================================
  // ОТМЕНИТЬ ОТМЕТКУ
  // ==================================================

  function undoCongratulation(
    id
  ) {

    unmarkCongratulated(
      id
    );


    const withBirthday =
      allFriends.filter(
        item =>
          item.bdate
      );


    renderBirthdays(
      withBirthday
    );

  }


  // ==================================================
  // ОТРИСОВКА
  // ==================================================

  function renderBirthdays(
    friends
  ) {

    todayList.innerHTML = "";
    soonList.innerHTML = "";
    doneList.innerHTML = "";
    allList.innerHTML = "";


    todaySection.style.display =
      "none";

    soonSection.style.display =
      "none";

    doneSection.style.display =
      "none";

    nothingSection.style.display =
      "none";

    allSection.style.display =
      "none";


    const prepared =
      friends
        .map(
          friend => ({

            friend,

            info:
              getBirthdayInfo(
                friend.bdate
              )

          })
        )
        .sort(
          (a, b) =>
            a.info.daysUntil -
            b.info.daysUntil
        );


    const today =
      prepared.filter(
        item =>
          item.info.daysUntil === 0 &&
          !isCongratulated(
            item.friend.id
          )
      );


    const soon =
      prepared.filter(
        item =>
          item.info.daysUntil >= 1 &&
          item.info.daysUntil <= 14
      );


    const done =
      prepared.filter(
        item =>
          item.info.daysUntil === 0 &&
          isCongratulated(
            item.friend.id
          )
      );


    // -------------------------------
    // СЕГОДНЯ
    // -------------------------------

    if (
      today.length > 0
    ) {

      todaySection.style.display =
        "block";


      today.forEach(
        item =>
          todayList.appendChild(
            createFriendCard(
              item.friend,
              item.info
            )
          )
      );

    } else {

      nothingSection.style.display =
        "block";

    }


    // -------------------------------
    // СКОРО
    // -------------------------------

    if (
      soon.length > 0
    ) {

      soonSection.style.display =
        "block";


      soon.forEach(
        item =>
          soonList.appendChild(
            createFriendCard(
              item.friend,
              item.info
            )
          )
      );

    }


    // -------------------------------
    // УЖЕ ПОЗДРАВИЛИ
    // -------------------------------

    if (
      done.length > 0
    ) {

      doneSection.style.display =
        "block";


      done.forEach(
        item =>
          doneList.appendChild(
            createFriendCard(
              item.friend,
              item.info
            )
          )
      );

    }


    // -------------------------------
    // ВСЕ
    // -------------------------------

    prepared.forEach(
      item =>
        allList.appendChild(
          createFriendCard(
            item.friend,
            item.info
          )
        )
    );


    allSection.style.display =
      "block";


    allButton.textContent =
      "Показать всех друзей";

  }


  // ==================================================
  // ПОКАЗАТЬ ВСЕХ
  // ==================================================

  allButton.addEventListener(
    "click",
    () => {

      if (
        allList.classList.contains(
          "visible"
        )
      ) {

        allList.classList.remove(
          "visible"
        );

        allButton.textContent =
          "Показать всех друзей";

      } else {

        allList.classList.add(
          "visible"
        );

        allButton.textContent =
          "Скрыть список";

      }

    }
  );


  // ==================================================
  // ОШИБКИ
  // ==================================================

  function showError(
    title,
    error
  ) {

    let errorText = "";


    if (error) {

      if (
        error.error_data &&
        error.error_data.error_msg
      ) {

        errorText =
          error.error_data.error_msg;

      } else if (
        error.error_data &&
        error.error_data.error_code
      ) {

        errorText =
          "Код ошибки VK: " +
          error.error_data.error_code;

      } else if (
        error.message
      ) {

        errorText =
          error.message;

      } else {

        try {

          errorText =
            JSON.stringify(
              error
            );

        } catch (e) {

          errorText =
            String(error);

        }

      }

    }


    if (!errorText) {

      errorText =
        "Причина ошибки не определена.";

    }


    status.innerHTML =
      "<b>" +
      escapeHtml(title) +
      "</b><br>" +
      escapeHtml(errorText);


    console.error(
      "Подробная ошибка:",
      error
    );

  }


  // ==================================================
  // ЗАЩИТА HTML
  // ==================================================

  function escapeHtml(
    text
  ) {

    return String(text)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  // ==================================================
  // ЗАПУСК
  // ==================================================

  startButton.addEventListener(
    "click",
    start
  );


  initApp();

</script>
