<!DOCTYPE html>
<html lang="ru">
<head>

<title>Поздравлялка 2.0</title>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
:root{--cream:#f7f1e7;--paper:#fffdf8;--paper2:#f1e6d8;--sage:#879984;--sage-dark:#657760;--terra:#b87862;--terra-dark:#9e624e;--brown:#59493e;--muted:#817166;--line:#e6d9ca;--green:#edf3e9;--lilac:#f1e8f5;--shadow:0 8px 25px rgba(89,73,62,.08)}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;padding:16px;background:radial-gradient(circle at 5% 8%,rgba(135,153,132,.12),transparent 25%),radial-gradient(circle at 95% 18%,rgba(184,120,98,.10),transparent 24%),var(--cream);color:var(--brown)}
.box{max-width:760px;margin:0 auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;padding:23px}.hero:after{content:"✿";position:absolute;right:22px;top:7px;font-size:55px;color:rgba(135,153,132,.15)}
.hero-top{display:flex;align-items:center;gap:14px}.logo-badge{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#eee2d1,#f9f3e9);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:inset 0 0 0 1px rgba(135,153,132,.15);position:relative;flex:none}.logo-badge:after{content:"❧";position:absolute;right:-4px;bottom:-8px;color:var(--sage);font-size:23px;transform:rotate(-15deg)}

.status{margin-top:12px;padding:11px 13px;border-radius:13px;background:#f4eee5;color:var(--muted);line-height:1.45;font-size:13px}
.search-wrap{display:none;margin-bottom:14px;position:relative}.search-wrap input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:13px 15px 13px 42px;color:var(--brown);outline:none;box-shadow:var(--shadow)}.search-wrap input:focus{border-color:var(--sage)}.search-icon{position:absolute;left:15px;top:10px;font-size:21px;opacity:.55;z-index:1}

.friend{padding:14px 0;border-bottom:1px solid var(--line)}.friend:last-child{border-bottom:0}.friend-row{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--paper2);flex:0 0 52px}.info{flex:1;min-width:0}.name{font-weight:700;margin-bottom:4px}.name a{color:var(--brown);text-decoration:none}.name a:hover{color:var(--terra-dark)}.meta{font-size:13px;color:var(--muted);line-height:1.5}.when{font-weight:700;color:var(--terra-dark)}.done{color:var(--sage-dark);font-weight:700}.row-actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0 64px}.row-actions button{font-size:12px;padding:8px 10px}.generate{background:var(--lilac);color:#765a80}.dialog{background:var(--sage);color:#fff}.mark{background:var(--green);color:var(--sage-dark)}.undo{background:#f0ebe5;color:var(--muted)}
.generator{display:none;margin:11px 0 0 64px;padding:16px;background:#fbf5ed;border:1px solid var(--line);border-radius:18px}.generator.open{display:block}.styles{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 11px}.style{background:var(--paper);color:var(--muted);border:1px solid var(--line);padding:8px 10px;font-size:12px}.style.active{background:var(--sage);color:#fff;border-color:var(--sage)}.message{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.55;white-space:pre-wrap;margin-bottom:9px}.generator .actions{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f6f0e7;border:1px solid var(--line);border-radius:15px;padding:11px 7px;text-align:center}.num{font-size:21px;font-family:Georgia,serif;font-weight:700;color:var(--sage-dark)}.label{font-size:11px;color:var(--muted);margin-top:3px}
.more{width:100%;margin-top:9px;background:var(--paper2);color:var(--brown)}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.history{display:none;margin-top:10px}.history.open{display:block}.history-item{padding:11px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-name{font-weight:700}.history-meta{font-size:13px;color:var(--muted);margin-top:3px}.counter{display:inline-block;background:var(--lilac);color:#765a80;border-radius:20px;padding:3px 8px;font-size:11px;vertical-align:middle}.empty{color:var(--muted);line-height:1.5}
.search-empty{padding:15px 0;color:var(--muted);text-align:center}.footer{text-align:center;color:var(--muted);font-size:11px;margin:25px 0 5px;opacity:.7}
@media(max-width:600px){body{padding:9px}.card{padding:16px;border-radius:19px}.hero{padding:18px}.hero-top{gap:11px}.logo-badge{width:56px;height:56px;font-size:29px}h1{font-size:25px}.row-actions,.generator{margin-left:0}.stats{grid-template-columns:repeat(2,1fr)}.history-head{align-items:flex-start;flex-direction:column}}
</style>
</head>

<body>

<div class="box">

  <div class="card hero">
  <div class="hero-top">
    <div class="logo-badge">🎂</div>
    <div>
      <h1>Поздравлялка ♡</h1>
      <p class="subtitle">Чтобы тёплые слова не терялись.</p>
    </div>
  </div>
  <div class="actions">
    <button id="loadBtn" class="primary">🌿 Загрузить друзей</button>
    <button id="refreshBtn" class="secondary" style="display:none">↻ Обновить друзей</button>
  </div>
  <div id="status" class="status">Подключаем приложение...</div>
</div>

<div id="searchWrap" class="search-wrap">
  <span class="search-icon">⌕</span>
  <input id="searchInput" type="text" placeholder="Найти друга..." autocomplete="off">
</div>

<div id="notice" class="card notice">

    <div
      id="noticeTitle"
      class="notice-title"
    ></div>

    <div id="noticeText"></div>

  </div>


  <div
    id="todaySection"
    class="card"
    style="display:none"
  >

    <h2 class="section-title red">
      🎉 Сегодня нужно поздравить
    </h2>

    <div id="todayList"></div>

  </div>


  <div
    id="soonSection"
    class="card"
    style="display:none"
  >

    <h2 class="section-title blue">
      📅 Ближайшие 7 дней
    </h2>

    <div id="soonList"></div>

  </div>


  <div
    id="doneSection"
    class="card"
    style="display:none"
  >

    <h2 class="section-title green">
      ✅ Уже поздравили сегодня
    </h2>

    <div id="doneList"></div>

  </div>


  <div
    id="statsSection"
    class="card"
    style="display:none"
  >

    <h2 class="section-title blue">
      📊 Статистика
    </h2>

    <div class="stats">

      <div class="stat">

        <div id="statFriends" class="num">
          0
        </div>

        <div class="label">
          друзей
        </div>

      </div>


      <div class="stat">

        <div id="statBirthdays" class="num">
          0
        </div>

        <div class="label">
          с датой рождения
        </div>

      </div>


      <div class="stat">
        <div id="statDone" class="num">0</div>
        <div class="label">поздравлено в этом году</div>
      </div>
      <div class="stat">
        <div id="statReserve" class="num">0</div>
        <div class="label">резервных дат</div>
      </div>

    </div>

  </div>


  <div
    id="historySection"
    class="card"
    style="display:none"
  >

    <div class="history-head">

      <h2
        class="section-title purple"
        style="margin:0"
      >
        📚 История

        <span
          id="historyCounter"
          class="counter"
        >
          0
        </span>

      </h2>

      <button
        id="historyToggle"
        class="secondary"
      >
        Показать
      </button>

    </div>

    <div
      id="historyList"
      class="history"
    ></div>

  </div>

<div class="footer">Поздравлялка ♡ · личный календарь дней рождения</div>

</div>

<script>

const APP_ID = 54728607;

const API_VERSION = "5.199";

const FRIENDS_CACHE_KEY =
  "pozdravlyalka_friends_cache_v4";

const HISTORY_KEY_PREFIX =
  "pz_h_";

const BIRTHDAY_RESERVE_KEY =
  "pozdravlyalka_birthday_reserve_v1";


let friends = [];

let historyCache = {};

let generatedMessages = {};

let selectedStyles = {};

let currentUserId = null;
let birthdayReserve = {};
function userScopedKey(prefix) {
  return prefix + String(currentUserId || "guest");
}

function friendsCacheKey() {
  return userScopedKey(FRIENDS_CACHE_KEY_PREFIX);
}

function birthdayReserveKey() {
  return userScopedKey(BIRTHDAY_RESERVE_KEY_PREFIX);
}

function historyKeyPrefix() {
  return HISTORY_KEY_PREFIX + String(currentUserId || "guest") + "_";
}



const $ = id =>
  document.getElementById(id);


/* ===========================
   VK
=========================== */

async function bridgeSend(method, params = {}) {

  return await vkBridge.send(
    method,
    params
  );

}


async function init() {

  try {

    await bridgeSend(
      "VKWebAppInit"
    );


    try {

      const user =
        await bridgeSend(
          "VKWebAppGetUserInfo"
        );

      currentUserId =
        user?.id || null;

    } catch (_) {}

    if (!currentUserId) {

      const fallbackKey =
        "pozdravlyalka_local_user_id";

      let fallbackId =
        localStorage.getItem(
          fallbackKey
        );

      if (!fallbackId) {

        fallbackId =
          "local_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);

        localStorage.setItem(
          fallbackKey,
          fallbackId
        );

      }

      currentUserId =
        fallbackId;

    }


    await loadCloudHistory();
    loadBirthdayReserve();


    const cached =
      readFriendsCache();


    if (
      cached &&
      cached.length
    ) {

      friends = cached;

      $("loadBtn").style.display =
        "none";

      $("refreshBtn").style.display =
        "inline-block";


      setStatus(
        "Данные загружены. Проверяем обновления в фоне..."
      );


      render();


      backgroundRefresh();

    } else {

      setStatus(
        "Приложение подключено. Первый раз нужно загрузить друзей."
      );

    }

  } catch (e) {

    showError(
      "Не удалось подключить приложение к VK.",
      e
    );

  }

}


async function backgroundRefresh() {

  try {

    await fetchFriends(true);

  } catch (e) {

    console.warn(
      "Фоновое обновление не удалось:",
      e
    );

    setStatus(
      "Показаны сохранённые данные. Фоновое обновление сейчас не удалось."
    );

  }

}


/* ===========================
   ДРУЗЬЯ
=========================== */

function readFriendsCache() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          friendsCacheKey()
        ) || "null"
      );

    return data &&
      Array.isArray(data.friends)
      ? data.friends
      : null;

  } catch (_) {

    return null;

  }

}


function saveFriendsCache(list) {

  try {

    localStorage.setItem(
      FRIENDS_CACHE_KEY,

      JSON.stringify({

        savedAt:
          new Date().toISOString(),

        friends:
          list

      })

    );

  } catch (_) {}

}


async function fetchFriends(
  background = false
) {

  $("loadBtn").disabled = true;

  $("refreshBtn").disabled = true;


  if (!background) {

    setStatus(
      "Запрашиваем доступ к списку друзей..."
    );

  }


  try {

    const auth =
      await bridgeSend(
        "VKWebAppGetAuthToken",
        {
          app_id: APP_ID,
          scope: "friends"
        }
      );


    if (
      !auth ||
      !auth.access_token
    ) {

      throw new Error(
        "VK не выдал токен доступа."
      );

    }


    if (!background) {

      setStatus(
        "Получаем свежий список друзей из VK..."
      );

    }


    const result =
      await bridgeSend(
        "VKWebAppCallAPIMethod",
        {

          method:
            "friends.get",

          params: {

            access_token:
              auth.access_token,

            v:
              API_VERSION,

            fields:
              "bdate,domain,photo_200",

            count:
              5000

          }

        }
      );


    if (
      !result ||
      !result.response
    ) {

      throw new Error(
        "VK не вернул список друзей."
      );

    }


    friends =
      result.response.items || [];

    updateBirthdayReserve(friends);

    saveFriendsCache(
      friends
    );


    $("loadBtn").style.display =
      "none";

    $("refreshBtn").style.display =
      "inline-block";


    setStatus(

      (
        background
          ? "Данные автоматически обновлены. "
          : "Данные успешно обновлены. "
      ) +

      "Последнее обновление: <b>" +

      formatDateTime(
        new Date()
      ) +

      "</b>"

    );


    render();

  } finally {

    $("loadBtn").disabled = false;

    $("refreshBtn").disabled = false;

  }

}


/* ===========================
   РЕЗЕРВНЫЕ ДАТЫ
=========================== */

function loadBirthdayReserve() {
  try {
    birthdayReserve =
      JSON.parse(
        localStorage.getItem(
          birthdayReserveKey()
        ) || "{}"
      ) || {};
  } catch (_) {
    birthdayReserve = {};
  }
}

function saveBirthdayReserve() {
  try {
    localStorage.setItem(
      BIRTHDAY_RESERVE_KEY,
      JSON.stringify(
        birthdayReserve
      )
    );
  } catch (_) {}
}

function updateBirthdayReserve(list) {
  let changed = false;

  list.forEach(friend => {
    if (!friend || !friend.id || !friend.bdate)
      return;

    const id = String(friend.id);

    // Запоминаем дату только при первом появлении для текущего пользователя.
    // Уже сохранённую дату автоматически не меняем.
    if (!birthdayReserve[id]) {
      birthdayReserve[id] = {
        friendId: friend.id,
        firstName: friend.first_name || "",
        lastName: friend.last_name || "",
        bdate: friend.bdate,
        savedAt: new Date().toISOString()
      };

      changed = true;
    } else {
      birthdayReserve[id].friendId = friend.id;
      birthdayReserve[id].firstName =
        friend.first_name || birthdayReserve[id].firstName || "";
      birthdayReserve[id].lastName =
        friend.last_name || birthdayReserve[id].lastName || "";
    }
  });

  if (changed)
    saveBirthdayReserve();
}

/* ===========================
   ДАТЫ
=========================== */

function birthdayInfo(bdate) {

  const p =
    bdate
      .split(".")
      .map(Number);


  const day =
    p[0];

  const month =
    p[1];

  const birthYear =
    p.length >= 3
      ? p[2]
      : null;


  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  let date =
    new Date(
      now.getFullYear(),
      month - 1,
      day
    );


  if (date < today) {

    date =
      new Date(
        now.getFullYear() + 1,
        month - 1,
        day
      );

  }


  const days =
    Math.round(
      (date - today) /
      86400000
    );


  const age =
    birthYear
      ? date.getFullYear() -
        birthYear
      : null;


  return {
    day,
    month,
    birthYear,
    date,
    days,
    age
  };

}


function formatDate(info) {

  const months = [

    "января",
    "февраля",
    "марта",
    "апреля",
    "мая",
    "июня",
    "июля",
    "августа",
    "сентября",
    "октября",
    "ноября",
    "декабря"

  ];


  return (
    info.day +
    " " +
    months[
      info.month - 1
    ]
  );

}


function formatDateTime(d) {

  return d.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function daysText(n) {

  if (n === 1)
    return "завтра";

  if (n === 2)
    return "послезавтра";


  return (
    "через " +
    n +
    " " +
    plural(
      n,
      "день",
      "дня",
      "дней"
    )
  );

}


function plural(
  n,
  one,
  few,
  many
) {

  const a =
    n % 100;

  const b =
    n % 10;


  if (
    a >= 11 &&
    a <= 19
  )
    return many;


  if (b === 1)
    return one;


  if (
    b >= 2 &&
    b <= 4
  )
    return few;


  return many;

}


function ageText(age) {

  if (age == null)
    return "День рождения";


  return (
    age +
    " " +
    plural(
      age,
      "год",
      "года",
      "лет"
    )
  );

}


/* ===========================
   ИСТОРИЯ
=========================== */

async function loadCloudHistory() {

  historyCache = {};


  try {

    const keysResult =
      await bridgeSend(
        "VKWebAppStorageGetKeys",
        {
          count: 1000,
          offset: 0
        }
      );


    const keys =
      keysResult?.keys || [];


    const historyKeys =
      keys.filter(
        k =>
          String(k).startsWith(
            HISTORY_KEY_PREFIX
          )
      );


    if (
      !historyKeys.length
    )
      return;


    const result =
      await bridgeSend(
        "VKWebAppStorageGet",
        {
          keys:
            historyKeys
        }
      );


    for (
      const item of
      (result?.keys || [])
    ) {

      if (!item.value)
        continue;


      try {

        historyCache[
          item.key
        ] =
          JSON.parse(
            item.value
          );

      } catch (_) {}

    }


  } catch (e) {

    console.warn(
      "Историю VK Storage прочитать не удалось:",
      e
    );

  }

}


async function saveHistoryEvent(
  friend,
  info
) {

  const key =
    eventKey(
      friend,
      info
    );


  const value = {

    friendId:
      friend.id,

    firstName:
      friend.first_name,

    lastName:
      friend.last_name,

    birthday:
      info.day +
      "." +
      info.month,

    birthdayYear:
      info.date.getFullYear(),

    markedAt:
      new Date().toISOString()

  };


  historyCache[key] =
    value;


  try {

    await bridgeSend(
      "VKWebAppStorageSet",
      {
        key,
        value:
          JSON.stringify(
            value
          )
      }
    );

  } catch (e) {

    console.warn(
      "VK Storage не сохранил историю:",
      e
    );

  }

}


async function deleteHistoryEvent(
  friend,
  info
) {

  const key =
    eventKey(
      friend,
      info
    );


  delete historyCache[key];


  try {

    await bridgeSend(
      "VKWebAppStorageSet",
      {
        key,
        value: ""
      }
    );

  } catch (e) {

    console.warn(
      "Не удалось убрать отметку:",
      e
    );

  }

}


function eventKey(
  friend,
  info
) {

  return (
    HISTORY_KEY_PREFIX +
    friend.id +
    "_" +
    info.day +
    "_" +
    info.month +
    "_" +
    info.date.getFullYear()
  );

}


function isDone(
  friend,
  info
) {

  return !!historyCache[
    eventKey(
      friend,
      info
    )
  ];

}


/* ===========================
   ГЛАВНЫЙ РЕНДЕР
=========================== */

function render() {
  const searchResults = $("searchResults");
  if (searchResults) searchResults.style.display = "none";

  const prepared =
    friends

      .map(f => {
        const birthday =
          f.bdate ||
          birthdayReserve[String(f.id)]?.bdate ||
          null;

        if (!birthday)
          return null;

        const info =
          birthdayInfo(
            birthday
          );

        info.isReserved =
          !f.bdate;

        return {
          friend: f,
          info
        };
      })

      .filter(Boolean)

      .sort(
        (a, b) =>
          a.info.days -
          b.info.days
      );


  renderToday(
    prepared
  );

  renderSoon(
    prepared
  );

  renderStats(
    prepared
  );

  renderHistory();

}


/* ===========================
   СЕГОДНЯ
=========================== */

function renderToday(
  prepared
) {

  const today =
    prepared.filter(
      x =>
        x.info.days === 0
    );


  const pending =
    today.filter(
      x =>
        !isDone(
          x.friend,
          x.info
        )
    );


  const done =
    today.filter(
      x =>
        isDone(
          x.friend,
          x.info
        )
    );


  $("todaySection")
    .style.display =
      pending.length
        ? "block"
        : "none";


  $("doneSection")
    .style.display =
      done.length
        ? "block"
        : "none";


  $("todayList")
    .innerHTML = "";


  $("doneList")
    .innerHTML = "";


  if (!today.length) {

    showNotice(
      "empty",
      "☕ Сегодня никого поздравлять не нужно.",
      "Можно спокойно заниматься своими делами."
    );

  }

  else if (!pending.length) {

    showNotice(
      "ok",
      "🎉 Все сегодняшние поздравления выполнены!",
      "Ты никого не забыла — можно спокойно заниматься своими делами. ❤️"
    );

  }

  else {

    showNotice(
      "ok",
      "🎂 Сегодня есть именинники!",
      "Осталось поздравить: <b>" +
      pending.length +
      "</b>."
    );


    pending.forEach(
      x =>
        $("todayList")
          .appendChild(
            friendCard(
              x.friend,
              x.info
            )
          )
    );

  }


  done.forEach(
    x =>
      $("doneList")
        .appendChild(
          friendCard(
            x.friend,
            x.info
          )
        )
  );

}


/* ===========================
   БЛИЖАЙШИЕ 7 ДНЕЙ
=========================== */

function renderSoon(
  prepared
) {

  const soon =
    prepared.filter(
      x =>
        x.info.days >= 1 &&
        x.info.days <= 7
    );


  $("soonSection")
    .style.display =
      soon.length
        ? "block"
        : "none";


  $("soonList")
    .innerHTML = "";


  soon.forEach(
    x =>
      $("soonList")
        .appendChild(
          friendCard(
            x.friend,
            x.info
          )
        )
  );

}


/* ===========================
   СТАТИСТИКА
=========================== */

function renderStats(
  prepared
) {

  $("statsSection")
    .style.display =
      "block";


  $("statFriends")
    .textContent =
      friends.length;


  $("statBirthdays")
    .textContent =
      prepared.length;


  const year =
    new Date()
      .getFullYear();


  $("statDone")
    .textContent =
      Object
        .values(historyCache)
        .filter(
          x =>
            x.birthdayYear ===
            year
        )
        .length;

  $("statReserve").textContent =
    Object.keys(
      birthdayReserve
    ).length;

}


/* ===========================
   ИСТОРИЯ
=========================== */

function renderHistory() {

  const entries =
    Object
      .values(historyCache)
      .sort(
        (a, b) =>
          new Date(
            b.markedAt
          ) -
          new Date(
            a.markedAt
          )
      );


  $("historySection")
    .style.display =
      "block";


  $("historyCounter")
    .textContent =
      entries.length;


  $("historyList")
    .innerHTML = "";


  if (!entries.length) {

    $("historyList")
      .innerHTML =
        '<div class="empty">Пока здесь ничего нет.</div>';

    return;

  }


  entries.forEach(
    e => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "history-item";


      div.innerHTML =

        '<div class="history-name">' +

        '✅ ' +

        esc(
          e.firstName +
          " " +
          e.lastName
        ) +

        '</div>' +

        '<div class="history-meta">' +

        'День рождения: ' +

        esc(
          e.birthday
        ) +

        " " +

        esc(
          e.birthdayYear
        ) +

        " · Поздравлено: " +

        esc(

          new Date(
            e.markedAt
          ).toLocaleDateString(
            "ru-RU",
            {
              day: "numeric",
              month: "long",
              year: "numeric"
            }
          )

        ) +

        "</div>";


      $("historyList")
        .appendChild(
          div
        );

    }
  );

}


/* ===========================
   УВЕДОМЛЕНИЕ
=========================== */

function showNotice(
  kind,
  title,
  text
) {

  $("notice").className =
    "card notice show " +
    kind;


  $("noticeTitle")
    .innerHTML =
      title;


  $("noticeText")
    .innerHTML =
      text;

}


function setStatus(
  html
) {

  $("status").innerHTML =
    html;

}


function showError(
  title,
  e
) {

  let text =
    e?.error_data?.error_msg ||
    e?.message ||
    "";


  if (!text) {

    try {

      text =
        JSON.stringify(e);

    } catch (_) {

      text =
        String(e);

    }

  }


  setStatus(
    "<b>" +
    esc(title) +
    "</b><br>" +
    esc(
      text ||
      "Причина неизвестна."
    )
  );

}


/* ===========================
   КАРТОЧКА ДРУГА
=========================== */

function friendCard(
  friend,
  info
) {

  const done =
    isDone(
      friend,
      info
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "friend";


  const url =
    friend.domain

      ? "https://vk.ru/" +
        friend.domain

      : "https://vk.ru/id" +
        friend.id;


  const avatar =
    friend.photo_200

      ? '<img class="avatar" src="' +
        esc(
          friend.photo_200
        ) +
        '" alt="">'

      : '<div class="avatar"></div>';


  div.innerHTML =

    '<div class="friend-row">' +

      avatar +

      '<div class="info">' +

        '<div class="name">' +

          '<a target="_blank" href="' +
          esc(url) +
          '">' +

          esc(
            friend.first_name +
            " " +
            friend.last_name
          ) +

          '</a>' +

        '</div>' +

        '<div class="meta">' +

          formatDate(info) +

          ' · 🎂 ' +

          ageText(info.age) +

          (info.isReserved
            ? '<br><span class="when">📌 Дата сохранена ранее</span>'
            : '') +

          '<br>' +

          (

            done

              ? '<span class="done">✅ Уже поздравили</span>'

              : '<span class="when">' +

                (

                  info.days === 0
                    ? "Сегодня 🎉"
                    : daysText(
                        info.days
                      )

                ) +

                '</span>'

          ) +

        '</div>' +

      '</div>' +

    '</div>' +


    '<div class="row-actions">' +


      (

        !done

          ? '<button class="generate" onclick="toggleGenerator(' +
            friend.id +
            ')">✨ Создать поздравление</button>'

          : ''

      ) +


      (

        !done

          ? '<button class="dialog" onclick="openReadyDialog(' +
            friend.id +
            ')">💬 Поздравить</button>'

          : '<button class="dialog" onclick="openDialogOnly(' +
            friend.id +
            ')">💬 Открыть диалог</button>'

      ) +


      (

        !done

          ? '<button class="mark" onclick="markDone(' +
            friend.id +
            ')">✅ Я поздравила</button>'

          : '<button class="undo" onclick="undoDone(' +
            friend.id +
            ')">↩ Отменить отметку</button>'

      ) +


    '</div>' +


    (

      !done

        ? generatorHtml(
            friend
          )

        : ''

    );


  return div;

}

/* ===========================
   ГЕНЕРАТОР
=========================== */

function generatorHtml(
  friend
) {

  const initialText =
    generatedMessages[
      friend.id
    ] ||
    makeGreeting(
      friend,
      "warm"
    );


  if (
    !generatedMessages[
      friend.id
    ]
  ) {

    generatedMessages[
      friend.id
    ] =
      initialText;

    selectedStyles[
      friend.id
    ] =
      "warm";

  }


  return '<div id="gen-' +
    friend.id +
    '" class="generator">' +

      '<b>✨ Какое поздравление сделать?</b>' +

      '<div class="styles">' +

        Object.keys(styles)
          .map(function(key) {

            return '<button class="style ' +
              (
                selectedStyles[
                  friend.id
                ] === key
                  ? 'active'
                  : ''
              ) +
              '" onclick="chooseStyle(' +
              friend.id +
              ',\'' +
              key +
              '\',this)">' +
              styles[key].label +
              '</button>';

          })
          .join("") +

      '</div>' +

      '<div id="msg-' +
      friend.id +
      '" class="message">' +

        esc(initialText) +

      '</div>' +

      '<div class="actions">' +

        '<button class="primary" onclick="copyGreeting(' +
        friend.id +
        ')">📋 Скопировать</button>' +

        '<button class="secondary" onclick="anotherGreeting(' +
        friend.id +
        ')">🎲 Другой вариант</button>' +

      '</div>' +

    '</div>';

}


function makeGreeting(
  friend,
  style
) {

  const arr =
    styles[
      style
    ].texts;


  return arr[
    Math.floor(
      Math.random() *
      arr.length
    )
  ].replace(
    "{name}",
    friend.first_name
  );

}


function toggleGenerator(
  id
) {

  const el =
    $("gen-" + id);


  if (el) {

    el.classList.toggle(
      "open"
    );

  }

}


function chooseStyle(
  id,
  style,
  btn
) {

  const friend =
    friends.find(
      f =>
        f.id === id
    );


  if (!friend)
    return;


  selectedStyles[
    id
  ] =
    style;


  generatedMessages[
    id
  ] =
    makeGreeting(
      friend,
      style
    );


  $("msg-" + id)
    .textContent =
      generatedMessages[
        id
      ];


  btn.parentElement
    .querySelectorAll(
      ".style"
    )
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  btn.classList.add(
    "active"
  );

}


function anotherGreeting(
  id
) {

  const friend =
    friends.find(
      f =>
        f.id === id
    );


  if (!friend)
    return;


  const style =
    selectedStyles[
      id
    ] ||
    "warm";


  generatedMessages[
    id
  ] =
    makeGreeting(
      friend,
      style
    );


  $("msg-" + id)
    .textContent =
      generatedMessages[
        id
      ];

}


/* ===========================
   КОПИРОВАНИЕ
=========================== */

async function copyText(
  text
) {

  try {

    await bridgeSend(
      "VKWebAppCopyText",
      {
        text
      }
    );

    return true;

  } catch (_) {

    try {

      await navigator.clipboard
        .writeText(text);

      return true;

    } catch (_) {}

  }


  return false;

}


async function copyGreeting(
  id
) {

  const text =
    generatedMessages[
      id
    ] ||
    $("msg-" + id)
      ?.textContent ||
    "";


  const ok =
    await copyText(
      text
    );


  if (ok) {

    setStatus(
      "💌 Поздравление скопировано. Можно вставить его в диалог VK."
    );

  }

}


/* ===========================
   ПОЗДРАВИТЬ
=========================== */

async function openReadyDialog(
  id
) {

  const friend =
    friends.find(
      f =>
        f.id === id
    );


  if (!friend)
    return;


  /*
    Если пользователь уже создавал
    поздравление — используем именно его.
    Если нет — создаём обычное.
  */

  const text =
    generatedMessages[
      id
    ] ||
    makeGreeting(
      friend,
      "warm"
    );


  generatedMessages[
    id
  ] =
    text;


  const copied =
    await copyText(
      text
    );


  const url =
    "https://vk.ru/im?sel=" +
    friend.id;


  window.open(
    url,
    "_blank"
  );


  if (copied) {

    setStatus(

      "💌 Поздравление для " +

      esc(
        friend.first_name
      ) +

      " скопировано. Диалог открыт — вставь текст и отправь его."

    );

  } else {

    setStatus(

      "Диалог с " +

      esc(
        friend.first_name
      ) +

      " открыт. Текст поздравления можно скопировать вручную."

    );

  }

}


/*
  Для человека, которого уже поздравили,
  оставляем просто открытие диалога.
*/

function openDialogOnly(
  id
) {

  const friend =
    friends.find(
      f =>
        f.id === id
    );


  if (!friend)
    return;


  window.open(
    "https://vk.ru/im?sel=" +
    friend.id,
    "_blank"
  );

}


/* ===========================
   ОТМЕТКА
=========================== */

function birthdayForFriend(friend) {
  if (!friend) return null;
  return friend.bdate || birthdayReserve[String(friend.id)]?.bdate || null;
}

async function markDone(
  id
) {

  const friend =
    friends.find(
      f =>
        f.id === id
    );


  const birthday = birthdayForFriend(friend);

  if (!friend || !birthday)
    return;

  const info =
    birthdayInfo(birthday);


  await saveHistoryEvent(
    friend,
    info
  );


  /*
    Здесь специально НЕТ автоматической
    отметки после кнопки "Поздравить".
    Только после "Я поздравила".
  */


  render();

}


async function undoDone(
  id
) {

  const friend =
    friends.find(
      f =>
        f.id === id
    );


  const birthday = birthdayForFriend(friend);

  if (!friend || !birthday)
    return;

  await deleteHistoryEvent(
    friend,
    birthdayInfo(birthday)
  );


  render();

}


/* ===========================
   ПОИСК ПО ДРУЗЬЯМ
=========================== */

$("searchInput").addEventListener("input", function() {
  const query = this.value.trim().toLowerCase();
  const oldResults = $("searchResults");

  if (oldResults) oldResults.remove();

  if (!query) {
    render();
    return;
  }

  $("notice").className = "card notice";
  $("todaySection").style.display = "none";
  $("soonSection").style.display = "none";
  $("doneSection").style.display = "none";
  $("statsSection").style.display = "none";
  $("historySection").style.display = "none";

  const box = document.createElement("div");
  box.id = "searchResults";
  box.className = "card";
  box.innerHTML = '<h2 class="section-title blue">🔎 Результаты поиска</h2>';
  $("searchWrap").insertAdjacentElement("afterend", box);

  const results = friends.filter(friend => {
    const name = (friend.first_name + " " + friend.last_name).toLowerCase();
    return name.includes(query);
  });

  if (!results.length) {
    box.innerHTML += '<div class="search-empty">Никого не нашли. Попробуй другое имя или фамилию.</div>';
    return;
  }

  results.forEach(friend => {
    const birthday = birthdayForFriend(friend);
    if (birthday) {
      box.appendChild(friendCard(friend, birthdayInfo(birthday)));
    } else {
      const div = document.createElement("div");
      div.className = "friend";
      const url = friend.domain ? "https://vk.ru/" + friend.domain : "https://vk.ru/id" + friend.id;
      const avatar = friend.photo_200 ? '<img class="avatar" src="' + esc(friend.photo_200) + '" alt="">' : '<div class="avatar"></div>';
      div.innerHTML = '<div class="friend-row">' + avatar + '<div class="info"><div class="name"><a target="_blank" href="' + esc(url) + '">' + esc(friend.first_name + " " + friend.last_name) + '</a></div><div class="meta">🎂 День рождения</div></div></div>';
      box.appendChild(div);
    }
  });
});

   КНОПКИ
=========================== */

$("loadBtn")
  .addEventListener(
    "click",
    () =>
      fetchFriends(false)
  );


$("refreshBtn")
  .addEventListener(
    "click",
    () =>
      fetchFriends(false)
  );


$("historyToggle")
  .addEventListener(
    "click",
    () => {

      $("historyList")
        .classList.toggle(
          "open"
        );


      $("historyToggle")
        .textContent =

        $("historyList")
          .classList
          .contains("open")

          ? "Скрыть"

          : "Показать";

    }
  );


function esc(
  text
) {

  return String(
    text ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
