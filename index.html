<!DOCTYPE html>
<html lang="ru">

<style>
* {

}

body {

<body>

<script>

const APP_ID = 54728607;

const API_VERSION = "5.199";

const FRIENDS_CACHE_KEY =
  "pozdravlyalka_friends_cache_v5";

const HISTORY_KEY_PREFIX =
  "pz_h_";

const BIRTHDAY_RESERVE_KEY =
  "pozdravlyalka_birthday_reserve_v1";


let friends = [];

let historyCache = {};

let generatedMessages = {};

let selectedStyles = {};

let currentUserId = null;

let birthdayReserve = {};


const $ = id =>
  document.getElementById(id);


/* ===========================
   VK
=========================== */

async function bridgeSend(
  method,
  params = {}
) {

  return await vkBridge.send(
    method,
    params
  );

}


/* ===========================
   ИНИЦИАЛИЗАЦИЯ
=========================== */

async function init() {

  try {

    await bridgeSend(
      "VKWebAppInit"
    );


    try {

      const user =
        await bridgeSend(
          "VKWebAppGetUserInfo"
        );

      currentUserId =
        user?.id || null;

    } catch (_) {}


    await loadCloudHistory();

    loadBirthdayReserve();


    const cached =
      readFriendsCache();


    if (
      cached &&
      cached.length
    ) {

      friends = cached;


      $("loadBtn").style.display =
        "none";


      $("refreshBtn").style.display =
        "inline-block";


      $("searchSection").style.display =
        "block";


      setStatus(
        "Данные загружены. Проверяем обновления в фоне..."
      );


      render();


      backgroundRefresh();

    } else {

      setStatus(
        "Приложение подключено. Первый раз нужно загрузить друзей."
      );

    }

  } catch (e) {

    showError(
      "Не удалось подключить приложение к VK.",
      e
    );

  }

}


/* ===========================
   ФОНОВОЕ ОБНОВЛЕНИЕ
=========================== */

async function backgroundRefresh() {

  try {

    await fetchFriends(true);

  } catch (e) {

    console.warn(
      "Фоновое обновление не удалось:",
      e
    );


    setStatus(
      "Показаны сохранённые данные. Фоновое обновление сейчас не удалось."
    );

  }

}


/* ===========================
   КЭШ ДРУЗЕЙ
=========================== */

function readFriendsCache() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          FRIENDS_CACHE_KEY
        ) || "null"
      );


    return data &&
      Array.isArray(
        data.friends
      )

      ? data.friends

      : null;

  } catch (_) {

    return null;

  }

}


function saveFriendsCache(
  list
) {

  try {

    localStorage.setItem(

      FRIENDS_CACHE_KEY,

      JSON.stringify({

        savedAt:
          new Date().toISOString(),

        friends:
          list

      })

    );

  } catch (_) {}

}


/* ===========================
   ПОЛУЧЕНИЕ ДРУЗЕЙ VK
=========================== */

async function fetchFriends(
  background = false
) {

  $("loadBtn").disabled =
    true;


  $("refreshBtn").disabled =
    true;


  if (!background) {

    setStatus(
      "Запрашиваем доступ к списку друзей..."
    );

  }


  try {

    const auth =
      await bridgeSend(
        "VKWebAppGetAuthToken",
        {

          app_id:
            APP_ID,

          scope:
            "friends"

        }
      );


    if (
      !auth ||
      !auth.access_token
    ) {

      throw new Error(
        "VK не выдал токен доступа."
      );

    }


    if (!background) {

      setStatus(
        "Получаем свежий список друзей из VK..."
      );

    }


    const result =
      await bridgeSend(
        "VKWebAppCallAPIMethod",
        {

          method:
            "friends.get",

          params: {

            access_token:
              auth.access_token,

            v:
              API_VERSION,

            fields:
              "bdate,domain,photo_200",

            count:
              5000

          }

        }
      );


    if (
      !result ||
      !result.response
    ) {

      throw new Error(
        "VK не вернул список друзей."
      );

    }


    friends =
      result.response.items || [];


    /*
      Запоминаем даты рождения,
      которые VK показывает сейчас.

      ВАЖНО:
      уже сохранённую дату не меняем.
    */

    updateBirthdayReserve(
      friends
    );


    saveFriendsCache(
      friends
    );


    $("loadBtn").style.display =
      "none";


    $("refreshBtn").style.display =
      "inline-block";


    $("searchSection").style.display =
      "block";


    setStatus(

      (
        background

          ? "Данные автоматически обновлены. "

          : "Данные успешно обновлены. "

      ) +

      "Сейчас друзей: <b>" +

      friends.length +

      "</b>. Последнее обновление: <b>" +

      formatDateTime(
        new Date()
      ) +

      "</b>"

    );


    render();


  } finally {

    $("loadBtn").disabled =
      false;


    $("refreshBtn").disabled =
      false;

  }

}


/* ===========================
   РЕЗЕРВНЫЕ ДАТЫ
=========================== */

function loadBirthdayReserve() {

  try {

    birthdayReserve =
      JSON.parse(

        localStorage.getItem(
          BIRTHDAY_RESERVE_KEY
        ) || "{}"

      ) || {};

  } catch (_) {

    birthdayReserve = {};

  }

}


function saveBirthdayReserve() {

  try {

    localStorage.setItem(

      BIRTHDAY_RESERVE_KEY,

      JSON.stringify(
        birthdayReserve
      )

    );

  } catch (_) {}

}


function updateBirthdayReserve(
  list
) {

  let changed =
    false;


  list.forEach(

    friend => {

      if (
        !friend ||
        !friend.id ||
        !friend.bdate
      )
        return;


      const id =
        String(
          friend.id
        );


      /*
        Первый раз увидели дату —
        сохраняем её.
      */

      if (
        !birthdayReserve[id]
      ) {

        birthdayReserve[id] = {

          friendId:
            friend.id,

          firstName:
            friend.first_name || "",

          lastName:
            friend.last_name || "",

          bdate:
            friend.bdate,

          savedAt:
            new Date()
              .toISOString()

        };


        changed =
          true;

      }


      else {

        /*
          Имя и фамилию можно обновлять,
          если человек их поменял.

          Дату рождения автоматически
          НЕ меняем.
        */

        birthdayReserve[id]
          .friendId =
            friend.id;


        birthdayReserve[id]
          .firstName =

            friend.first_name ||

            birthdayReserve[id]
              .firstName ||

            "";


        birthdayReserve[id]
          .lastName =

            friend.last_name ||

            birthdayReserve[id]
              .lastName ||

            "";

      }

    }

  );


  if (
    changed
  ) {

    saveBirthdayReserve();

  }

}


/* ===========================
   ДАТЫ
=========================== */

function birthdayInfo(
  bdate
) {

  const p =
    bdate
      .split(".")
      .map(Number);


  const day =
    p[0];


  const month =
    p[1];


  const birthYear =
    p.length >= 3
      ? p[2]
      : null;


  const now =
    new Date();


  const today =
    new Date(

      now.getFullYear(),

      now.getMonth(),

      now.getDate()

    );


  let date =
    new Date(

      now.getFullYear(),

      month - 1,

      day

    );


  if (
    date < today
  ) {

    date =
      new Date(

        now.getFullYear() + 1,

        month - 1,

        day

      );

  }


  const days =
    Math.round(

      (
        date -
        today

      ) /

      86400000

    );


  const age =
    birthYear

      ? date.getFullYear() -
        birthYear

      : null;


  return {

    day,

    month,

    birthYear,

    date,

    days,

    age

  };

}


/* ===========================
   ФОРМАТ ДАТЫ
=========================== */

function formatDate(
  info
) {

  const months = [

    "января",
    "февраля",
    "марта",
    "апреля",
    "мая",
    "июня",
    "июля",
    "августа",
    "сентября",
    "октября",
    "ноября",
    "декабря"

  ];


  return (

    info.day +

    " " +

    months[
      info.month - 1
    ]

  );

}


/* ===========================
   ВОЗРАСТ
=========================== */

function ageText(
  age
) {

  if (
    age == null
  ) {

    return "День рождения";

  }


  return (

    age +

    " " +

    plural(

      age,

      "год",

      "года",

      "лет"

    )

  );

}


/* ===========================
   "ЧЕРЕЗ..."
=========================== */

function daysText(
  n
) {

  if (
    n === 1
  )
    return "завтра";


  if (
    n === 2
  )
    return "послезавтра";


  return (

    "через " +

    n +

    " " +

    plural(

      n,

      "день",

      "дня",

      "дней"

    )

  );

}


function plural(
  n,
  one,
  few,
  many
) {

  const a =
    n % 100;


  const b =
    n % 10;


  if (
    a >= 11 &&
    a <= 19
  )
    return many;


  if (
    b === 1
  )
    return one;


  if (
    b >= 2 &&
    b <= 4
  )
    return few;


  return many;

}


/* ===========================
   ВРЕМЯ
=========================== */

function formatDateTime(
  d
) {

  return d.toLocaleString(

    "ru-RU",

    {

      day:
        "2-digit",

      month:
        "2-digit",

      year:
        "numeric",

      hour:
        "2-digit",

      minute:
        "2-digit"

    }

  );

}


/* ===========================
   ИСТОРИЯ
=========================== */

async function loadCloudHistory() {

  historyCache = {};


  try {

    const keysResult =
      await bridgeSend(

        "VKWebAppStorageGetKeys",

        {

          count:
            1000,

          offset:
            0

        }

      );


    const keys =
      keysResult?.keys || [];


    const historyKeys =
      keys.filter(

        k =>

          String(k)
            .startsWith(
              HISTORY_KEY_PREFIX
            )

      );


    if (
      !historyKeys.length
    )
      return;


    const result =
      await bridgeSend(

        "VKWebAppStorageGet",

        {

          keys:
            historyKeys

        }

      );


    for (
      const item of
      (result?.keys || [])
    ) {

      if (
        !item.value
      )
        continue;


      try {

        historyCache[
          item.key
        ] =

          JSON.parse(
            item.value
          );

      } catch (_) {}

    }


  } catch (e) {

    console.warn(

      "Историю VK Storage прочитать не удалось:",

      e

    );

  }

}


async function saveHistoryEvent(
  friend,
  info
) {

  const key =
    eventKey(

      friend,

      info

    );


  const value = {

    friendId:
      friend.id,

    firstName:
      friend.first_name,

    lastName:
      friend.last_name,

    birthday:

      info.day +

      "." +

      info.month,

    birthdayYear:

      info.date.getFullYear(),

    markedAt:

      new Date()
        .toISOString()

  };


  historyCache[key] =
    value;


  try {

    await bridgeSend(

      "VKWebAppStorageSet",

      {

        key,

        value:

          JSON.stringify(
            value
          )

      }

    );

  } catch (e) {

    console.warn(

      "VK Storage не сохранил историю:",

      e

    );

  }

}


async function deleteHistoryEvent(
  friend,
  info
) {

  const key =
    eventKey(

      friend,

      info

    );


  delete historyCache[key];


  try {

    await bridgeSend(

      "VKWebAppStorageSet",

      {

        key,

        value:
          ""

      }

    );

  } catch (e) {

    console.warn(

      "Не удалось убрать отметку:",

      e

    );

  }

}


function eventKey(
  friend,
  info
) {

  return (

    HISTORY_KEY_PREFIX +

    friend.id +

    "_" +

    info.day +

    "_" +

    info.month +

    "_" +

    info.date.getFullYear()

  );

}


function isDone(
  friend,
  info
) {

  return !!historyCache[

    eventKey(

      friend,

      info

    )

  ];

}

   ОСНОВНОЙ РЕНДЕР
=========================== */

function render() {

  const prepared =

    friends

      .map(

        f => {

          /*
            Сначала используем
            текущую дату VK.

            Если VK её не показывает —
            берём резервную.
          */

          const birthday =

            f.bdate ||

            birthdayReserve[
              String(f.id)
            ]?.bdate ||

            null;


          if (
            !birthday
          )
            return null;


          const info =
            birthdayInfo(
              birthday
            );


          info.isReserved =
            !f.bdate;


          return {

            friend:
              f,

            info:
              info

          };

        }

      )

      .filter(
        Boolean
      )

      .sort(

        (a, b) =>

          a.info.days -

          b.info.days

      );


  renderToday(
    prepared
  );


  renderSoon(
    prepared
  );


  renderStats(
    prepared
  );


  renderHistory();

}


/* ===========================
   СЕГОДНЯ
=========================== */

function renderToday(
  prepared
) {

  const today =

    prepared.filter(

      x =>

        x.info.days === 0

    );


  const pending =

    today.filter(

      x =>

        !isDone(

          x.friend,

          x.info

        )

    );


  const done =

    today.filter(

      x =>

        isDone(

          x.friend,

          x.info

        )

    );


  $("todaySection")
    .style.display =

      pending.length

        ? "block"

        : "none";


  $("doneSection")
    .style.display =

      done.length

        ? "block"

        : "none";


  $("todayList")
    .innerHTML =
      "";


  $("doneList")
    .innerHTML =
      "";


  if (
    !today.length
  ) {

    showNotice(

      "empty",

      "☕ Сегодня никого поздравлять не нужно.",

      "Можно спокойно заниматься своими делами."

    );

  }

  else if (
    !pending.length
  ) {

    showNotice(

      "ok",

      "🎉 Все сегодняшние поздравления выполнены!",

      "Ты никого не забыла — можно спокойно заниматься своими делами. ❤️"

    );

  }

  else {

    showNotice(

      "ok",

      "🎂 Сегодня есть именинники!",

      "Осталось поздравить: <b>" +

      pending.length +

      "</b>."

    );


    pending.forEach(

      x =>

        $("todayList")
          .appendChild(

            friendCard(

              x.friend,

              x.info

            )

          )

    );

  }


  done.forEach(

    x =>

      $("doneList")
        .appendChild(

          friendCard(

            x.friend,

            x.info

          )

        )

  );

}


/* ===========================
   БЛИЖАЙШИЕ 7 ДНЕЙ
=========================== */

function renderSoon(

) {

  const soon =

    prepared.filter(

        x.info.days >= 1 &&

function renderStats(
  prepared
) {

  $("statsSection")
    .style.display =
      "block";


  $("statFriends")
    .textContent =
      friends.length;


  $("statBirthdays")

        .filter(

   ИСТОРИЯ
=========================== */

function renderHistory() {

  const entries =

    Object
      .values(
        historyCache
      )

      .sort(

        (a, b) =>

          new Date(
            b.markedAt
          ) -

          new Date(
            a.markedAt
          )

      );


  $("historySection")
    .style.display =
      "block";


  $("historyCounter")
    .textContent =
      entries.length;


  $("historyList")
    .innerHTML =
      "";


  if (
    !entries.length
  ) {

    $("historyList")
      .innerHTML =

        '<div class="empty">' +

        'Пока здесь ничего нет.' +

        '</div>';

    return;

  }


  entries.forEach(

    e => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "history-item";


      div.innerHTML =

        '<div class="history-name">' +

        '✅ ' +

        esc(

          e.firstName +

          " " +

          e.lastName

        ) +

        '</div>' +


        '<div class="history-meta">' +

        'День рождения: ' +

        esc(
          e.birthday
        ) +

        " " +

        esc(
          e.birthdayYear
        ) +

        " · Поздравлено: " +

        esc(

          new Date(
            e.markedAt
          )

          .toLocaleDateString(

            "ru-RU",

            {

              day:
                "numeric",

              month:
                "long",

              year:
                "numeric"

            }

          )

        ) +

        "</div>";


      $("historyList")
        .appendChild(
          div
        );

    }

  );

}

function friendCard(

  info
) {

  const done =

      friend,

      info

    );


  const div =

    document.createElement(
      "div"
    );


  div.className =
    "friend";


  const url =

    friend.domain

      ? "https://vk.ru/" +
        friend.domain

      : "https://vk.ru/id" +
        friend.id;


  const avatar =

    friend.photo_200

      ? '<img class="avatar" src="' +

        esc(
          friend.photo_200
        ) +

        '" alt="">'

      : '<div class="avatar"></div>';


  div.innerHTML =

    '<div class="friend-row">' +

      avatar +

      '<div class="info">' +

        '<div class="name">' +

          '<a target="_blank" href="' +

          esc(url) +

          '">' +

          esc(

            friend.first_name +

            " " +

            friend.last_name

          ) +

          '</a>' +

        '</div>' +

        '<div class="meta">' +

          formatDate(info) +

          ' · 🎂 ' +

          ageText(info.age) +

          (

            info.isReserved

              ? '<br><span class="when">📌 Дата сохранена ранее</span>'

              : ''

          ) +

          '<br>' +

          (

            done

              ? '<span class="done">' +

                '✅ Уже поздравили' +

                '</span>'

              : '<span class="when">' +

                (

                  info.days === 0

                    ? "Сегодня 🎉"

                    : daysText(
                        info.days
                      )

                ) +

                '</span>'

          ) +

        '</div>' +

      '</div>' +

    '</div>' +


    '<div class="row-actions">' +


      (

        !done

          ? '<button class="generate" onclick="toggleGenerator(' +

            friend.id +

            ')">' +

            '✨ Создать поздравление' +

            '</button>'

          : ''

      ) +


      (

        !done

          ? '<button class="dialog" onclick="openReadyDialog(' +

            friend.id +

            ')">' +

            '💬 Поздравить' +

            '</button>'

          : '<button class="dialog" onclick="openDialogOnly(' +

            friend.id +

            ')">' +

            '💬 Открыть диалог' +

      ) +


      (

        !done

          ? '<button class="mark" onclick="markDone(' +

            friend.id +

            ')">' +

            '✅ Я поздравила' +

            '</button>'

          : '<button class="undo" onclick="undoDone(' +

            friend.id +

            ')">' +

            '↩ Отменить отметку' +

            '</button>'

      ) +


    '</div>' +


    (

      !done

        ? generatorHtml(
            friend
          )

        : ''

    );


  return div;

}

function generatorHtml(
  friend
) {

  const initialText =

    generatedMessages[
      friend.id
    ] ||

    makeGreeting(
      friend,
      "warm"
    );


  if (
    !generatedMessages[
      friend.id
    ]
  ) {

    generatedMessages[
      friend.id
    ] =
      initialText;


    selectedStyles[
      friend.id
    ] =
      "warm";

  }


  return (

    '<div id="gen-' +

    friend.id +

    '" class="generator">' +

      '<b>✨ Какое поздравление сделать?</b>' +

      '<div class="styles">' +

        Object.keys(styles)

          .map(

            function(key) {

              return (

                '<button class="style ' +

                (

                  selectedStyles[
                    friend.id
                  ] === key

                    ? 'active'

                    : ''

                ) +

                '" onclick="chooseStyle(' +

                friend.id +

                ',\'' +

                key +

                '\',this)">' +

                styles[key].label +

                '</button>'

              );

            }

          )

          .join("") +

      '</div>' +

      '<div id="msg-' +

      friend.id +

      '" class="message">' +

        esc(
          initialText
        ) +

      '</div>' +

      '<div class="actions">' +

        '<button class="primary" onclick="copyGreeting(' +

        friend.id +

        ')">' +

        '📋 Скопировать' +

        '</button>' +

        '<button class="secondary" onclick="anotherGreeting(' +

        friend.id +

        ')">' +

        '🎲 Другой вариант' +

        '</button>' +

      '</div>' +

    '</div>'

  );

}


function makeGreeting(
  friend,
  style
) {

  const arr =
    styles[
      style
    ].texts;


  return arr[

    Math.floor(

      Math.random() *
      arr.length

    )

  ]

  .replace(

    "{name}",

    friend.first_name

  );

}


function toggleGenerator(
  id
) {

  const el =
    $("gen-" + id);


  if (el) {

    el.classList.toggle(
      "open"
    );

  }

}


function chooseStyle(
  id,
  style,
  btn
) {

  const friend =
    friends.find(

      f =>
        f.id === id

    );


  if (!friend)
    return;


  selectedStyles[
    id
  ] =
    style;


  generatedMessages[
    id
  ] =
    makeGreeting(
      friend,
      style
    );


  $("msg-" + id)
    .textContent =
      generatedMessages[
        id
      ];


  btn.parentElement
    .querySelectorAll(
      ".style"
    )

    .forEach(

      x =>
        x.classList.remove(
          "active"
        )

    );


  btn.classList.add(
    "active"
  );

}


function anotherGreeting(
  id
) {

  const friend =
    friends.find(

      f =>
        f.id === id

    );


  if (!friend)
    return;


  const style =
    selectedStyles[
      id
    ] ||
    "warm";


  generatedMessages[
    id
  ] =
    makeGreeting(
      friend,
      style
    );


  $("msg-" + id)
    .textContent =
      generatedMessages[
        id
      ];

}

async function copyText(
  text
) {

  try {

    await bridgeSend(

      "VKWebAppCopyText",

      {
        text
      }

    );


    return true;

  } catch (_) {


    try {

      await navigator.clipboard
        .writeText(
          text
        );


      return true;

    } catch (_) {}

  }


  return false;

}


async function copyGreeting(
  id
) {

  const text =

    generatedMessages[
      id
    ] ||

    $("msg-" + id)
      ?.textContent ||

    "";


  const ok =
    await copyText(
      text
    );


  if (ok) {

    setStatus(

      "💌 Поздравление скопировано. Можно вставить его в диалог VK."

    );

  }

}

async function openReadyDialog(
  id
) {

  const friend =
    friends.find(

      f =>
        f.id === id

    );


  if (!friend)
    return;


  const text =

    generatedMessages[
      id
    ] ||

    makeGreeting(
      friend,
      "warm"
    );


  generatedMessages[
    id
  ] =
    text;


  const copied =
    await copyText(
      text
    );


  const url =

    "https://vk.ru/im?sel=" +

    friend.id;


  window.open(
    url,
    "_blank"
  );


  if (copied) {

    setStatus(

      "💌 Поздравление для " +

      esc(
        friend.first_name
      ) +

      " скопировано. Диалог открыт — вставь текст и отправь его."

    );

  } else {

    setStatus(

      "Диалог с " +

      esc(
        friend.first_name
      ) +

      " открыт. Текст поздравления можно скопировать вручную."

    );

  }

}


function openDialogOnly(
  id
) {

  const friend =
    friends.find(

      f =>
        f.id === id

    );


  if (!friend)
    return;


  window.open(

    "https://vk.ru/im?sel=" +

    friend.id,

    "_blank"

  );

}


/* ===========================
   ОТМЕТКА
=========================== */

async function markDone(
  id
) {

  const friend =
    friends.find(

      f =>
        f.id === id

    );


  if (
    !friend ||
    !birthdayForFriend(friend)
  )
    return;


  const info =
    birthdayInfo(
      birthdayForFriend(friend)
    );


  await saveHistoryEvent(
    friend,
    info
  );


  render();

}


async function undoDone(
  id
) {

  const friend =
    friends.find(

      f =>
        f.id === id

    );


  if (
    !friend ||
    !birthdayForFriend(friend)
  )
    return;


  await deleteHistoryEvent(

    friend,

    birthdayInfo(
      birthdayForFriend(friend)
    )

  );


  render();

}

function searchFriends(
  query
) {

  const normalized =
    query
      .trim()
      .toLowerCase();


  if (!normalized) {

    $("searchResults")
      .innerHTML =
        "";


    $("searchResultsCount")
      .style.display =
        "none";


    $("searchClear")
      .style.display =
        "none";


    return;

  }


  $("searchClear")
    .style.display =
      "block";


  const results =
    friends.filter(

      friend => {

        const fullName =

          (

            friend.first_name +
            " " +
            friend.last_name

          )

          .toLowerCase();


        return fullName
          .includes(
            normalized
          );

      }

    );


  $("searchResults")
    .innerHTML =
      "";


  $("searchResultsCount")
    .style.display =
      "block";


  $("searchResultsCount")
    .textContent =

    "Найдено: " +

    results.length;


  if (!results.length) {

    $("searchResults")
      .innerHTML =

        '<div class="no-results">' +

        '😔 Никого не нашли. Попробуй проверить написание имени или фамилии.' +

        '</div>';

    return;

  }


  results.forEach(

    friend => {

      const birthday =
        birthdayForFriend(
          friend
        );


      if (!birthday) {

        $("searchResults")
          .appendChild(

            friendCardWithoutBirthday(
              friend
            )

          );

      } else {

        $("searchResults")
          .appendChild(

            friendCard(

              friend,

              birthdayInfo(
                birthday
              )

            )

          );

      }

    }

  );

}

   ПОИСК: КНОПКИ
=========================== */

$("searchInput")
  .addEventListener(

    "input",

    function() {

      searchFriends(
        this.value
      );

    }

  );


$("searchClear")
  .addEventListener(

    "click",

    function() {

      $("searchInput")
        .value =
          "";


      $("searchResults")
        .innerHTML =
          "";


      $("searchResultsCount")
        .style.display =
          "none";


      this.style.display =
        "none";


      $("searchInput")
        .focus();

    }

  );


/* ===========================
   КНОПКИ ПРИЛОЖЕНИЯ
=========================== */

$("loadBtn")
  .addEventListener(

    "click",

    () =>
      fetchFriends(false)

  );


$("refreshBtn")
  .addEventListener(

    "click",

    () =>
      fetchFriends(false)

  );


$("historyToggle")
  .addEventListener(

    "click",

    () => {

      $("historyList")
        .classList.toggle(
          "open"
        );


      $("historyToggle")
        .textContent =

        $("historyList")
          .classList
          .contains("open")

          ? "Скрыть"

          : "Показать";

    }

  );


/* ===========================
   ESCAPE HTML
=========================== */

function esc(
  text
) {

  return String(
    text ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ===========================
   ЗАПУСК
=========================== */

init();

</script>

</body>
</html>
